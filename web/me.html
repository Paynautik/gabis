<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>What you owe · gabis</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <style>
    /* Everything here belongs to the person who owes money, which is the side
       collections software normally treats as a target. Same single-request
       page as the statement it grew out of: no fonts, no framework, no bundle. */
    :root {
      --cream: #F4F0E8;
      --surface: #FFFFFF;
      --ink: #1E0C62;
      --ink-soft: #5B5372;
      --ink-faint: #8B8399;
      --line: #E2DCD1;
      --lime: #D9FF43;
      --lime-ink: #5B7500;
      --green: #1F7A52;
      --red: #B4231F;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    .brand { display: block; width: 88px; height: auto; margin-bottom: 26px; }

    .who { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 4px; }

    .amount {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin: 0 0 6px;
      font-variant-numeric: tabular-nums;
    }

    .what { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 24px; }
    .what b { color: var(--ink); font-weight: 600; }

    .section {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 28px 0 10px;
    }

    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 10px;
    }

    a.card:active { transform: translateY(1px); }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: baseline;
    }

    .from { font-weight: 700; font-size: 15.5px; }
    .sum { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .meta { margin-top: 7px; font-size: 12.5px; color: var(--ink-faint); }

    .tag {
      display: inline-block;
      border-radius: 100px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 8px;
    }

    .tag.late { background: #FBE9E8; color: var(--red); }
    .tag.open { background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); }
    .tag.paid { background: #E7F3ED; color: var(--green); }

    .rights {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-top: 8px;
    }

    .rights h2 { margin: 0 0 10px; font-size: 15px; }
    .rights ul { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 13.5px; }
    .rights li { margin-bottom: 7px; }
    .rights a { color: var(--ink); }

    .empty {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }

    .empty h1 { margin: 0 0 8px; font-size: 19px; }
    .empty p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; }

    .foot {
      margin-top: 28px;
      color: var(--ink-faint);
      font-size: 12px;
      line-height: 1.55;
    }

    .forget {
      background: none;
      border: none;
      color: var(--ink-faint);
      font: inherit;
      font-size: 12.5px;
      text-decoration: underline;
      padding: 0;
      margin-top: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="brand" src="/gabis-wordmark.png" alt="gabis">
    <div id="content"></div>
  </div>

  <script>
    (function () {
      // Statements remembered on this device, one per business, saved by the
      // statement page itself. Nothing here has ever been sent to gabis: no
      // account, no password, no server holding a list of what somebody owes.
      // The cost is honest and worth stating on the page — clear the browser
      // and this is empty again.
      var KEY = 'gabis.statements.v1';

      function load() {
        try {
          var raw = localStorage.getItem(KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      var symbols = { NGN: '₦', USD: '$', GBP: '£', KES: 'KSh ', GHS: 'GH₵ ' };

      function money(n, cur) {
        var symbol = symbols[cur] || (cur ? cur + ' ' : '');
        return symbol + Number(n || 0).toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      var rights =
        '<div class="section">What a business using gabis may do</div>' +
        '<div class="rights">' +
          '<h2>These are enforced in the software, not promised</h2>' +
          '<ul>' +
            '<li>Reminders reach you between 8am and 8pm, never at night.</li>' +
            '<li>At most one a day, and at most three in any week.</li>' +
            '<li>Reply <b>STOP</b> and the automated reminders end permanently. ' +
              'A person may still contact you; the software will not.</li>' +
            '<li>Every reminder says which business is asking. None of them ' +
              'threaten you, and none of them contact anyone else about your debt.</li>' +
            '<li>Every attempt is written to a log the business itself cannot ' +
              'edit or delete.</li>' +
          '</ul>' +
          '<p style="margin:12px 0 0;font-size:13px;color:var(--ink-soft)">' +
            'If something reaches you that breaks these rules, it did not come ' +
            'from gabis. <a href="/standard">Read the full standard</a>.' +
          '</p>' +
        '</div>';

      var saved = load();
      var businesses = Object.keys(saved);

      if (!businesses.length) {
        document.getElementById('content').innerHTML =
          '<div class="empty">' +
            '<h1>Nothing here yet</h1>' +
            '<p>When a business sends you a gabis statement link, opening it ' +
              'adds it here. Everything you owe, in one place, without an account.</p>' +
            '<p style="margin:0">This page is kept on this device only. gabis ' +
              'never receives it.</p>' +
          '</div>' + rights;
        return;
      }

      var today = new Date();
      today.setHours(0, 0, 0, 0);

      var total = 0;
      var overdue = 0;
      var currency = null;
      var mixed = false;

      var cards = businesses.map(function (name) {
        var entry = saved[name] || {};
        var items = (entry.inv || []).filter(function (i) { return i.st !== 'draft'; });

        var owed = 0;
        var late = 0;
        var latest = 0;

        items.forEach(function (it) {
          if (it.st === 'paid') return;
          owed += Number(it.amt || 0);
          var due = it.due ? new Date(it.due + 'T00:00:00') : null;
          if (due && !isNaN(due) && due < today) {
            late += Number(it.amt || 0);
            var days = Math.round((today - due) / 86400000);
            if (days > latest) latest = days;
          }
        });

        var cur = entry.cur || 'NGN';
        if (currency === null) currency = cur;
        else if (currency !== cur) mixed = true;

        total += owed;
        overdue += late;

        var tag = owed === 0
          ? '<span class="tag paid">Settled</span>'
          : latest > 0
            ? '<span class="tag late">' + latest + (latest === 1 ? ' day' : ' days') + ' overdue</span>'
            : '<span class="tag open">Nothing overdue</span>';

        var open = items.filter(function (i) { return i.st !== 'paid'; }).length;

        return '<a class="card" href="/portal#' + encodeURIComponent(entry.raw || '') + '">' +
            '<div class="top">' +
              '<span class="from">' + esc(name) + '</span>' +
              '<span class="sum">' + esc(money(owed, cur)) + '</span>' +
            '</div>' +
            '<div class="meta">' + tag +
              (open === 1 ? '1 open invoice' : open + ' open invoices') +
            '</div>' +
          '</a>';
      }).join('');

      // Adding two currencies together would produce a number that means
      // nothing. When they differ, the businesses are still listed, each with
      // its own total, and no headline figure is invented.
      var head = mixed
        ? '<p class="who">What you owe</p>' +
          '<p class="amount">' + businesses.length + '</p>' +
          '<p class="what">business' + (businesses.length === 1 ? '' : 'es') +
            ', billed in different currencies — each total is shown separately below.</p>'
        : '<p class="who">What you owe, across ' + businesses.length +
            ' business' + (businesses.length === 1 ? '' : 'es') + '</p>' +
          '<p class="amount">' + esc(money(total, currency || 'NGN')) + '</p>' +
          '<p class="what">' +
            (total === 0
              ? 'Nothing outstanding. Everything below is settled.'
              : 'outstanding' +
                (overdue > 0 ? ', of which <b>' + esc(money(overdue, currency || 'NGN')) + '</b> is overdue' : '')) +
          '</p>';

      document.getElementById('content').innerHTML = head +
        '<div class="section">Who you owe</div>' + cards +
        rights +
        '<p class="foot">Kept on this device only, from statement links you have ' +
          'opened. gabis never receives this list, and no account was created to ' +
          'show it to you. Clearing your browser data clears it.</p>' +
        '<button class="forget" id="forget" type="button">Forget everything on this device</button>';

      document.getElementById('forget').addEventListener('click', function () {
        try { localStorage.removeItem(KEY); } catch (e) {}
        location.reload();
      });
    })();
  </script>
</body>
</html>
